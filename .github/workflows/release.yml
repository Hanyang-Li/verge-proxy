name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-13
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/verge-proxy" dist/
          tar -czf "verge-proxy-${{ matrix.target }}.tar.gz" -C dist verge-proxy
          shasum -a 256 "verge-proxy-${{ matrix.target }}.tar.gz" > "verge-proxy-${{ matrix.target }}.tar.gz.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            verge-proxy-${{ matrix.target }}.tar.gz
            verge-proxy-${{ matrix.target }}.tar.gz.sha256
