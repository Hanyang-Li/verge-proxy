name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Build
        run: cargo build --release --locked --target ${{ env.TARGET }}

      - name: Package
        run: |
          mkdir dist
          cp "target/${{ env.TARGET }}/release/verge-proxy" dist/
          tar -czf "verge-proxy-${{ env.TARGET }}.tar.gz" -C dist verge-proxy
          shasum -a 256 "verge-proxy-${{ env.TARGET }}.tar.gz" > "verge-proxy-${{ env.TARGET }}.tar.gz.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            verge-proxy-${{ env.TARGET }}.tar.gz
            verge-proxy-${{ env.TARGET }}.tar.gz.sha256
